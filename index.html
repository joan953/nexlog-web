        contacte: { crumb: "Accueil / Contact", title: "Contactez-nous", subtitle: "Dites-nous ce que vous devez déplacer et nous préparerons un devis technique sans engagement.", dadesTitle: "Coordonnées", labels: ["Adresse", "Téléphone", "E-mail", "Horaires"], horari: "Du lundi au vendredi, de 8h00 à 18h00", formTitle: "Demandez votre devis", f: { nom: "Nom et prénom *", empresa: "Entreprise", email: "E-mail *", telefon: "Téléphone", consulta: "Demande opérationnelle *", btn: "Envoyer la demande", ok: "Merci ! Nous avons bien reçu votre demande. Nous vous répondrons sous 24 h ouvrées." }, ph: { nom: "Votre nom", empresa: "Nom de l'entreprise", email: "nom@entreprise.com", telefon: "+34 600 000 000", consulta: "Indiquez origine, destination, type de marchandise et volume." } },
        blog: { crumb: "Accueil / Blog", title: "Blog logistique", subtitle: "Articles pratiques sur le commerce international, le transport et la chaîne d'approvisionnement.", posts: [["Commerce international", "Incoterms® 2020 : qui paie et qui assume le risque", "La différence entre FOB, CIF et DAP et comment choisir le bon terme.", "15 janvier 2026"], ["Chaîne d'approvisionnement", "Comment réduire le coût logistique avec le groupage", "Quand il vaut la peine d'expédier de petits volumes en LCL et LTL.", "8 janvier 2026"], ["Douanes", "Le DUA pas à pas pour les nouveaux importateurs", "Qu'est-ce que le Document Administratif Unique et comment éviter les retenues.", "19 décembre 2025"]] },
        footer: { tagline: "Solutions logistiques globales : transport maritime, routier et entreposage avec gestion douanière.", navTitle: "Navigation", servTitle: "Services", contTitle: "Contact", services: ["Transport maritime", "Transport routier", "Entreposage et douane"], student: "Site de test (projet étudiant)" },
      },
    };

    function Logo({ className = "h-9 w-9" }) {
      return (<svg className={className} viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#0f172a" /><path d="M10 29 L22 23 L34 29" stroke="#60a5fa" strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round" /><path d="M10 22.5 L22 16.5 L34 22.5" stroke="#2563eb" strokeWidth="2.8" fill="none" strokeLinecap="round" strokeLinejoin="round" /></svg>);
    }
    function Media({ src, alt, className = "" }) {
      return (<div className={"relative overflow-hidden bg-gradient-to-br from-slate-800 to-blue-700 " + className}><img src={src} alt={alt} loading="lazy" onError={(e) => { e.currentTarget.style.display = "none"; }} className="absolute inset-0 w-full h-full object-cover" /></div>);
    }

    function Navbar({ page, go, lang, setLang, t }) {
      const [open, setOpen] = useState(false);
      const ids = ["inici", "serveis", "empresa", "blog", "contacte"];
      const cls = (id) => "px-3 py-2 rounded-md text-sm font-medium transition " + (page === id ? "text-blue-600" : "text-slate-700 hover:text-blue-600");
      const Switch = ({ className = "" }) => (
        <div className={"flex items-center gap-1 " + className}>
          {["ca","es","en","fr"].map((l) => (
            <button key={l} onClick={() => setLang(l)} className={"px-1.5 py-1 text-xs font-semibold rounded transition " + (lang === l ? "bg-blue-600 text-white" : "text-slate-500 hover:text-blue-600")}>{l.toUpperCase()}</button>
          ))}
        </div>
      );
      return (
        <header className="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
          <div className="max-w-6xl mx-auto px-5 flex items-center justify-between h-16">
            <button onClick={() => { go("inici"); setOpen(false); }} className="flex items-center gap-2"><Logo /><span className="font-extrabold text-lg text-slate-900">NexLog <span className="text-blue-600">Logística</span></span></button>
            <nav className="hidden md:flex items-center gap-1">
              {ids.map((id) => (<button key={id} onClick={() => go(id)} className={cls(id)}>{t.nav[id]}</button>))}

              <button onClick={() => go("contacte")} className="ml-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">{t.nav.quote}</button>
            </nav>
            <button onClick={() => setOpen(!open)} className="md:hidden inline-flex items-center justify-center h-10 w-10 rounded-lg border border-slate-200 text-slate-700" aria-label="Menú">
              <svg className="h-6 w-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">{open ? <path strokeLinecap="round" strokeLinejoin="round" d="M6 6l12 12M18 6L6 18" /> : <path strokeLinecap="round" strokeLinejoin="round" d="M4 7h16M4 12h16M4 17h16" />}</svg>
            </button>
          </div>
          {open && (
            <nav className="md:hidden border-t border-slate-200 bg-white px-5 py-3 flex flex-col gap-1">
              {ids.map((id) => (<button key={id} onClick={() => { go(id); setOpen(false); }} className={cls(id) + " text-left"}>{t.nav[id]}</button>))}
              <Switch className="mt-2 mb-1" />
              <button onClick={() => { go("contacte"); setOpen(false); }} className="mt-1 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white">{t.nav.quote}</button>
            </nav>
          )}
        </header>
      );
    }

    function Footer({ t }) {
      const year = new Date().getFullYear();
      return (
        <footer className="bg-slate-900 text-slate-300">
          <div className="max-w-6xl mx-auto px-5 py-14 grid gap-10 md:grid-cols-4">
            <div>
              <div className="flex items-center gap-2 mb-4"><Logo /><span className="font-extrabold text-lg text-white">NexLog <span className="text-blue-400">Logística</span></span></div>
              <p className="text-sm text-slate-400 max-w-xs">{t.footer.tagline}</p>
            </div>
            <div><h4 className="text-white font-semibold mb-4">{t.footer.navTitle}</h4><ul className="space-y-2 text-sm text-slate-400"><li>{t.nav.inici}</li><li>{t.nav.serveis}</li><li>{t.nav.empresa}</li><li>{t.nav.blog}</li><li>{t.nav.contacte}</li></ul></div>
            <div><h4 className="text-white font-semibold mb-4">{t.footer.servTitle}</h4><ul className="space-y-2 text-sm text-slate-400">{t.footer.services.map((s) => (<li key={s}>{s}</li>))}</ul></div>
            <div><h4 className="text-white font-semibold mb-4">{t.footer.contTitle}</h4><ul className="space-y-2 text-sm text-slate-400"><li>{contact.address1}<br />{contact.address2}</li><li>{contact.phone}</li><li>{contact.email}</li></ul></div>
          </div>
          <div className="border-t border-white/10">
            <div className="max-w-6xl mx-auto px-5 py-5 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
              <p className="text-xs text-slate-500">© {year} NexLog Logística · {t.footer.student} · Actualitzat 16/11/2026 · Versió 2.1</p>
              <nav className="flex gap-5 text-xs text-slate-400"><a href="#" className="hover:text-white">Avís Legal</a><a href="#" className="hover:text-white">Privacitat</a><a href="#" className="hover:text-white">Cookies</a></nav>
            </div>
          </div>
        </footer>
      );
    }

    function Home({ go, t }) {
      return (
        <div>
          <section className="relative bg-slate-900 text-white">
            <img src={IMG.hero} alt={t.hero.title} onError={(e)=>{e.currentTarget.style.display="none";}} className="absolute inset-0 w-full h-full object-cover opacity-30" />
            <div className="absolute inset-0 bg-gradient-to-r from-slate-900 via-slate-900/85 to-slate-900/40"></div>
            <div className="relative max-w-6xl mx-auto px-5 py-24 md:py-32">
              <p className="uppercase tracking-widest text-blue-300 text-sm font-semibold mb-3">{t.hero.eyebrow}</p>
              <h1 className="text-4xl md:text-5xl font-extrabold leading-tight max-w-2xl mb-5">{t.hero.title}</h1>
              <p className="text-lg text-slate-200 max-w-xl mb-8">{t.hero.lead}</p>
              <div className="flex flex-wrap gap-3">
                <button onClick={() => go("contacte")} className="rounded-lg bg-blue-600 px-6 py-3 font-semibold hover:bg-blue-700">{t.hero.quote}</button>
                <button onClick={() => go("serveis")} className="rounded-lg border border-white/40 px-6 py-3 font-semibold hover:bg-white hover:text-slate-900 transition">{t.hero.services}</button>
              </div>
            </div>
          </section>

          <section className="bg-blue-700 text-white">
            <div className="max-w-6xl mx-auto px-5 py-10 grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
              {t.stats.map((label, i) => (<div key={label}><p className="text-3xl font-extrabold">{nums[i]}</p><p className="text-sm text-blue-100 mt-1">{label}</p></div>))}
            </div>
          </section>

          <section className="max-w-6xl mx-auto px-5 py-16 md:py-20">
            <div className="text-center max-w-2xl mx-auto mb-12"><h2 className="text-3xl font-extrabold text-slate-900 mb-3">{t.home.title}</h2><p className="text-slate-500">{t.home.subtitle}</p></div>
            <div className="grid gap-8 md:grid-cols-3">
              {t.home.cards.map((c, i) => (
                <div key={c[0]} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition">
                  <Media src={IMG.srv[i]} alt={c[0]} className="h-44" />
                  <div className="p-6"><h3 className="text-lg font-bold text-slate-900 mb-2">{c[0]}</h3><p className="text-slate-500 text-sm mb-4">{c[1]}</p><button onClick={() => go("serveis")} className="text-blue-600 font-semibold text-sm hover:underline">{t.home.link}</button></div>
                </div>
              ))}
            </div>
          </section>

          <section className="bg-white border-t border-slate-200">
            <div className="max-w-6xl mx-auto px-5 py-16">
              <div className="max-w-2xl mb-10"><h2 className="text-2xl md:text-3xl font-extrabold text-slate-900 mb-3">{t.intro.title}</h2><p className="text-slate-500">{t.intro.text}</p></div>
              <div className="grid gap-6 md:grid-cols-3">
                {t.intro.points.map((p) => (<div key={p[0]} className="rounded-2xl border border-slate-200 p-6 bg-slate-50"><h3 className="text-lg font-bold text-slate-900 mb-2">{p[0]}</h3><p className="text-slate-500 text-sm">{p[1]}</p></div>))}
              </div>
            </div>
          </section>

          <section className="bg-slate-900 text-white">
            <div className="max-w-6xl mx-auto px-5 py-16 text-center"><h2 className="text-2xl md:text-3xl font-extrabold mb-3">{t.cta.title}</h2><p className="text-slate-300 max-w-xl mx-auto mb-7">{t.cta.text}</p><button onClick={() => go("contacte")} className="inline-block rounded-lg bg-blue-600 px-7 py-3 font-semibold hover:bg-blue-700">{t.cta.btn}</button></div>
          </section>
        </div>
      );
    }

    function Serveis({ go, t }) {
      return (
        <div>
          <section className="bg-slate-900 text-white"><div className="max-w-6xl mx-auto px-5 py-16"><p className="text-sm text-slate-400 mb-3">{t.serveis.crumb}</p><h1 className="text-3xl md:text-4xl font-extrabold mb-3">{t.serveis.title}</h1><p className="text-slate-300 max-w-2xl">{t.serveis.subtitle}</p></div></section>
          <section className="max-w-6xl mx-auto px-5 py-16">
            {t.serveis.items.map((s, i) => (
              <article key={codes[i].code} className={"bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm mb-10 md:flex " + (i % 2 === 1 ? "md:flex-row-reverse" : "")}>
                <Media src={IMG.srv[i]} alt={s.title} className="md:w-2/5 h-56 md:h-auto" />
                <div className="p-8 md:w-3/5">
                  <div className="flex flex-wrap gap-2 mb-4">
                    <span className="font-mono text-xs bg-slate-100 border border-slate-200 rounded px-2.5 py-1">{t.serveis.numTecnic}: <b className="text-blue-600">{codes[i].code}</b></span>
                    <span className="font-mono text-xs bg-slate-100 border border-slate-200 rounded px-2.5 py-1">{t.serveis.refInterna}: <b className="text-blue-600">{codes[i].ref}</b></span>
                  </div>
                  <h2 className="text-xl font-bold text-slate-900 mb-3">{s.title}</h2>
                  <p className="text-slate-600 mb-5">{s.def}</p>
                  <p className="text-xs font-semibold uppercase tracking-wide text-blue-600 mb-3">{t.serveis.dades}</p>
                  <ul className="space-y-2 mb-6">{s.specs.map((sp, idx) => (<li key={idx} className="flex gap-2 text-sm text-slate-600"><span className="text-blue-600 font-bold">✓</span><span><b className="text-slate-900">{sp[0]}:</b> {sp[1]}</span></li>))}</ul>
                  <button onClick={() => go("contacte")} className="inline-block rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">{t.serveis.btn}</button>
                </div>
              </article>
            ))}
          </section>
        </div>
      );
    }

    function Empresa({ go, t }) {
      return (
        <div>
          <section className="bg-slate-900 text-white"><div className="max-w-6xl mx-auto px-5 py-16"><p className="text-sm text-slate-400 mb-3">{t.empresa.crumb}</p><h1 className="text-3xl md:text-4xl font-extrabold mb-3">{t.empresa.title}</h1><p className="text-slate-300 max-w-2xl">{t.empresa.subtitle}</p></div></section>
          <section className="max-w-6xl mx-auto px-5 py-16 grid gap-12 md:grid-cols-2 md:items-center">
            <Media src={IMG.about} alt={t.empresa.aboutTitle} className="rounded-2xl h-72 md:h-80 shadow-sm" />
            <div><h2 className="text-2xl font-extrabold text-slate-900 mb-4">{t.empresa.aboutTitle}</h2><p className="text-slate-600 mb-6">{t.empresa.aboutText}</p><button onClick={() => go("contacte")} className="inline-block rounded-lg border border-slate-300 px-5 py-2.5 text-sm font-semibold text-slate-800 hover:border-blue-600 hover:text-blue-600 transition">{t.empresa.btn}</button></div>
          </section>
          <section className="bg-white border-t border-slate-200"><div className="max-w-6xl mx-auto px-5 py-16"><div className="text-center max-w-2xl mx-auto mb-12"><h2 className="text-3xl font-extrabold text-slate-900 mb-3">{t.empresa.valorsTitle}</h2><p className="text-slate-500">{t.empresa.valorsSubtitle}</p></div><div className="grid gap-8 md:grid-cols-3">{t.empresa.valors.map((v) => (<div key={v[0]} className="rounded-2xl border border-slate-200 p-7 bg-slate-50"><h3 className="text-lg font-bold text-slate-900 mb-2">{v[0]}</h3><p className="text-slate-500 text-sm">{v[1]}</p></div>))}</div></div></section>
        </div>
      );
    }

    function Contacte({ t }) {
      const [sent, setSent] = useState(false);
      const [sending, setSending] = useState(false);
      const [error, setError] = useState(false);
      const c = t.contacte;
      const values = [contact.address1 + " — " + contact.address2, contact.phone, contact.email, c.horari];
      const handleSubmit = async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        setSending(true); setError(false);
        try {
          const res = await fetch("https://formspree.io/f/mnpdprzl", { method: "POST", body: new FormData(form), headers: { Accept: "application/json" } });
          if (res.ok) { setSent(true); form.reset(); } else { setError(true); }
        } catch (err) { setError(true); }
        setSending(false);
      };
      return (
        <div>
          <section className="bg-slate-900 text-white"><div className="max-w-6xl mx-auto px-5 py-16"><p className="text-sm text-slate-400 mb-3">{c.crumb}</p><h1 className="text-3xl md:text-4xl font-extrabold mb-3">{c.title}</h1><p className="text-slate-300 max-w-2xl">{c.subtitle}</p></div></section>
          <section className="max-w-6xl mx-auto px-5 py-16 grid gap-10 md:grid-cols-2">
            <div>
              <h2 className="text-2xl font-extrabold text-slate-900 mb-6">{c.dadesTitle}</h2>
              <ul className="space-y-4">{c.labels.map((label, i) => (<li key={label} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm"><p className="font-semibold text-slate-900">{label}</p><p className="text-slate-500 text-sm mt-1">{values[i]}</p></li>))}</ul>
            </div>
            <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">
              <h2 className="text-xl font-bold text-slate-900 mb-5">{c.formTitle}</h2>
              <form onSubmit={handleSubmit}>
                <input type="hidden" name="_subject" value="Nova sol·licitud — web NexLog" />
                <div className="grid sm:grid-cols-2 gap-4">
                  <div><label className="block text-sm font-medium text-slate-700 mb-1">{c.f.nom}</label><input required name="nom" type="text" className="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder={c.ph.nom} /></div>
                  <div><label className="block text-sm font-medium text-slate-700 mb-1">{c.f.empresa}</label><input name="empresa" type="text" className="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder={c.ph.empresa} /></div>
                </div>
                <div className="grid sm:grid-cols-2 gap-4 mt-4">
                  <div><label className="block text-sm font-medium text-slate-700 mb-1">{c.f.email}</label><input required name="email" type="email" className="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder={c.ph.email} /></div>
                  <div><label className="block text-sm font-medium text-slate-700 mb-1">{c.f.telefon}</label><input name="telefon" type="tel" className="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder={c.ph.telefon} /></div>
                </div>
                <div className="mt-4"><label className="block text-sm font-medium text-slate-700 mb-1">{c.f.consulta}</label><textarea required name="consulta" rows="5" className="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder={c.ph.consulta}></textarea></div>
                <button type="submit" disabled={sending} className="mt-5 w-full rounded-lg bg-blue-600 px-5 py-3 font-semibold text-white hover:bg-blue-700 disabled:opacity-60">{sending ? "..." : c.f.btn}</button>
                {sent && <p className="mt-4 rounded-lg bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3">{c.f.ok}</p>}
                {error && <p className="mt-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3">Error · {contact.email}</p>}
              </form>
            </div>
          </section>
        </div>
      );
    }

    function Blog({ t }) {
      return (
        <div>
          <section className="bg-slate-900 text-white"><div className="max-w-6xl mx-auto px-5 py-16"><p className="text-sm text-slate-400 mb-3">{t.blog.crumb}</p><h1 className="text-3xl md:text-4xl font-extrabold mb-3">{t.blog.title}</h1><p className="text-slate-300 max-w-2xl">{t.blog.subtitle}</p></div></section>
          <section className="max-w-6xl mx-auto px-5 py-16"><div className="grid gap-8 md:grid-cols-3">
            {t.blog.posts.map((p, i) => (
              <article key={p[1]} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition">
                <Media src={IMG.blog[i]} alt={p[1]} className="h-44" />
                <div className="p-6"><span className="inline-block text-xs font-semibold uppercase tracking-wide text-white bg-blue-600 rounded-full px-3 py-1 mb-3">{p[0]}</span><h2 className="text-lg font-bold text-slate-900 mb-2">{p[1]}</h2><p className="text-slate-500 text-sm mb-3">{p[2]}</p><p className="text-xs text-slate-400">{p[3]}</p></div>
              </article>
            ))}
          </div></section>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState("inici");
      const [lang, setLang] = useState("ca");
      const t = translations[lang];
      const go = (p) => { setPage(p); window.scrollTo(0, 0); };
      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-700">
          <Navbar page={page} go={go} lang={lang} setLang={setLang} t={t} />
          <main className="flex-1">
            {page === "inici" && <Home go={go} t={t} />}
            {page === "serveis" && <Serveis go={go} t={t} />}
            {page === "empresa" && <Empresa go={go} t={t} />}
            {page === "contacte" && <Contacte t={t} />}
            {page === "blog" && <Blog t={t} />}
          </main>
          <Footer t={t} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</html>
